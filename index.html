<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PixelForge — Free Browser Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    overflow-x: hidden;
    font-family: 'Inter', sans-serif;
    background: #14101f;
    color: #f2eefb;
    min-height: 100vh;
    scroll-behavior: smooth;
  }
  :root {
    --bg: #14101f;
    --bg2: #1c1730;
    --card: #211b38;
    --card-border: #332a54;
    --amber: #ffb703;
    --magenta: #ff3d81;
    --text: #f2eefb;
    --muted: #9088ad;
  }
  .pixel { font-family: 'Press Start 2P', monospace; }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--card-border);
    position: sticky;
    top: 0;
    background: rgba(20,16,31,0.98);
    backdrop-filter: blur(10px);
    z-index: 50;
    width: 100%;
  }
  .logo {
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .logo .cart {
    width: 22px; height: 22px;
    background: linear-gradient(135deg, var(--amber), var(--magenta));
    border-radius: 4px;
    position: relative;
  }
  .logo .cart::after {
    content: '';
    position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 6px;
    background: var(--bg);
    border-radius: 2px;
  }
  .logo span { color: var(--amber); }

  .auth-btn {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.7rem;
    cursor: pointer;
  }

  .hero {
    text-align: center;
    padding: 40px 16px 30px;
    background: radial-gradient(ellipse 500px 250px at 50% 0%, rgba(255,61,129,0.15), transparent);
  }
  .hero .eyebrow { font-size: 0.55rem; color: var(--amber); letter-spacing: 2px; margin-bottom: 10px; }
  .hero h1 { font-size: 1.5rem; font-weight: 800; line-height: 1.3; max-width: 500px; margin: 0 auto; }
  .hero h1 .hl { color: var(--magenta); }
  .hero p.sub { color: var(--muted); margin-top: 12px; font-size: 0.82rem; max-width: 400px; margin-left: auto; margin-right: auto; }

  .section-label {
    max-width: 1000px;
    margin: 30px auto 12px;
    padding: 0 16px;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .grid {
    max-width: 1000px;
    margin: 0 auto 90px; /* extra bottom space so bottom nav doesn't cover last row */
    padding: 0 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  .game-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }
  .game-card:hover { border-color: var(--amber); }
  .game-card .thumb {
    width: 100%;
    aspect-ratio: 4/3;
    background: linear-gradient(135deg, #2a2350, #1c1730);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    background-size: cover;
    background-position: center;
  }
  .game-card .info { padding: 10px; }
  .game-card h3 { font-size: 0.75rem; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .game-card p { font-size: 0.6rem; color: var(--muted); }

  .empty-state { text-align: center; color: var(--muted); padding: 30px; font-size: 0.8rem; }

  /* MODALS */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(10,8,16,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 360px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-box h2 { font-size: 0.9rem; margin-bottom: 14px; }
  .field { margin-bottom: 10px; }
  .field label { font-size: 0.7rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .field input {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 9px;
    border-radius: 8px;
    font-size: 0.8rem;
  }
  .btn-primary {
    width: 100%;
    padding: 11px;
    background: linear-gradient(90deg, var(--magenta), var(--amber));
    color: #14101f;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    margin-top: 6px;
  }
  .btn-google {
    width: 100%;
    padding: 10px;
    background: #fff;
    color: #333;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.8rem;
    cursor: pointer;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-secondary {
    width: 100%;
    padding: 9px;
    background: none;
    border: 1px solid var(--card-border);
    color: var(--muted);
    border-radius: 8px;
    font-size: 0.75rem;
    cursor: pointer;
    margin-top: 6px;
  }
  .divider { text-align: center; color: var(--muted); font-size: 0.65rem; margin: 10px 0; position: relative; }
  .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 38%; height: 1px; background: var(--card-border); }
  .divider::before { left: 0; } .divider::after { right: 0; }

  .msg { font-size: 0.7rem; margin-top: 8px; text-align: center; }
  .msg.error { color: #ff6b6b; }
  .msg.success { color: #6cff9c; }

  #playModal iframe { width: 100%; max-width: 850px; flex: 1; border: none; border-radius: 8px; background: #000; }
  #playModal { flex-direction: column; }
  .play-header { width: 100%; max-width: 850px; display: flex; justify-content: space-between; align-items: center; padding: 10px; }
  .close-btn { background: var(--card); border: 1px solid var(--card-border); color: var(--text); width: 30px; height: 30px; border-radius: 6px; cursor: pointer; }

  footer { text-align: center; color: #4a4266; font-size: 0.65rem; padding: 20px; padding-bottom: 90px; border-top: 1px solid var(--card-border); margin-top: 30px; }

  /* ===== BOTTOM NAVIGATION BAR (separate, mobile-app style) ===== */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(20,16,31,0.98);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--card-border);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index: 60;
  }
  .bottom-nav button {
    background: none;
    border: none;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 0.6rem;
    cursor: pointer;
    padding: 4px 10px;
  }
  .bottom-nav button .icon { font-size: 1.1rem; }
  .bottom-nav button.active { color: var(--amber); }
</style>
</head>
<body>

<nav>
  <div class="logo pixel"><div class="cart"></div>Pixel<span>Forge</span></div>
  <button class="auth-btn pixel" id="authNavBtn" onclick="openAuthModal()">LOGIN</button>
</nav>

<section class="hero">
  <div class="eyebrow pixel">PRESS START</div>
  <h1>Free browser games. <span class="hl">No installs.</span></h1>
  <p class="sub">Instant-play browser games. Login and start playing.</p>
</section>

<div class="section-label pixel" id="gameGridContainer">// GAME LIBRARY</div>
<div class="grid" id="gameGrid"></div>
<div class="empty-state" id="emptyState" style="display:none;">No games uploaded yet — check back soon.</div>

<div class="modal-overlay" id="playModal">
  <div class="play-header">
    <h3 id="playTitle" style="font-size:0.8rem;"></h3>
    <button class="close-btn" onclick="closePlayModal()">✕</button>
  </div>
  <!-- sandbox: uploaded game HTML cannot read parent page/cookies/storage -->
  <iframe id="playFrame" sandbox="allow-scripts"></iframe>
</div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="authModal">
  <div class="modal-box">
    <h2 id="authTitle" class="pixel">Login / Register</h2>
    <button class="btn-google" onclick="loginWithGoogle()">
      <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.19-1.84H9v3.49h4.84c-.21 1.13-.86 2.08-1.82 2.72v2.26h2.94c1.72-1.58 2.72-3.9 2.72-6.63z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.94-2.26c-.81.54-1.84.86-3.02.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33C2.45 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.75c-.19-.54-.3-1.12-.3-1.75s.11-1.21.3-1.75V4.92H.96C.35 6.13 0 7.5 0 9s.35 2.87.96 4.08l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2.02.96 4.92l3.01 2.33c.71-2.13 2.69-3.67 5.03-3.67z"/></svg>
      Continue with Google
    </button>
    <div class="divider">OR EMAIL</div>
    <div class="field"><label>Email</label><input type="email" id="userEmail" placeholder="your@email.com"></div>
    <div class="field"><label>Password</label><input type="password" id="userPassword" placeholder="••••••••"></div>
    <button class="btn-primary" onclick="handleUserAuth()">Continue with Email</button>
    <button class="btn-secondary" id="toggleAuthMode" onclick="toggleAuthMode()">New here? Create Account</button>
    <button class="btn-secondary" onclick="closeAuthModal()">Cancel</button>
    <div class="msg" id="authMsg"></div>
  </div>
</div>

<div class="modal-overlay" id="adminModal">
  <div class="modal-box" id="adminBoxContent"></div>
</div>

<footer>PixelForge — games run entirely in your browser.
  <span id="secretSpot" style="display:inline-block; width:40px; height:40px; vertical-align:middle;"></span>
</footer>

<!-- ===== SEPARATE BOTTOM NAV BAR (games ke liye) ===== -->
<div class="bottom-nav">
  <button class="active" onclick="window.scrollTo({top:0, behavior:'smooth'})">
    <span class="icon">🏠</span>Home
  </button>
  <button onclick="document.getElementById('gameGridContainer').scrollIntoView({behavior:'smooth'})">
    <span class="icon">🕹️</span>Games
  </button>
  <button onclick="openAuthModal()">
    <span class="icon">👤</span>Account
  </button>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDXHnyAUPOYd45RCYjienLhbFviUCe5JS4",
    authDomain: "game-2e42e.firebaseapp.com",
    projectId: "game-2e42e",
    storageBucket: "game-2e42e.firebasestorage.app",
    messagingSenderId: "323139672747",
    appId: "1:323139672747:web:205c4b9fcd214791dfb5ee",
    measurementId: "G-YW325R7TT7"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  let currentUser = null;
  let isRegistering = false;

  function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str == null ? '' : String(str); return d.innerHTML; }

  // No coins field anymore — user doc sirf email store karta hai (login tracking ke liye)
  function ensureUserDoc(user) {
    const userRef = db.collection('users').doc(user.uid);
    return userRef.get().then(doc => {
      if (doc.exists) return;
      return userRef.set({ email: user.email });
    });
  }

  auth.onAuthStateChanged(user => {
    currentUser = user;
    const authBtn = document.getElementById('authNavBtn');
    authBtn.textContent = user ? 'LOGOUT' : 'LOGIN';
  });

  function openAuthModal() { if (currentUser) { auth.signOut(); return; } document.getElementById('authModal').classList.add('show'); }
  function closeAuthModal() { document.getElementById('authModal').classList.remove('show'); }

  function toggleAuthMode() {
    isRegistering = !isRegistering;
    document.getElementById('authTitle').textContent = isRegistering ? 'Create Account' : 'User Login';
    document.getElementById('toggleAuthMode').textContent = isRegistering ? 'Existing user? Login here' : 'New here? Create Account';
  }

  function loginWithGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).then(result => ensureUserDoc(result.user)).then(() => {
      closeAuthModal();
    }).catch(err => alert(err.message));
  }

  function handleUserAuth() {
    const email = document.getElementById('userEmail').value.trim();
    const pass = document.getElementById('userPassword').value;
    const msg = document.getElementById('authMsg');
    msg.textContent = 'Processing...'; msg.className = 'msg';

    const promise = isRegistering ? auth.createUserWithEmailAndPassword(email, pass) : auth.signInWithEmailAndPassword(email, pass);
    promise.then(cred => ensureUserDoc(cred.user)).then(() => {
      closeAuthModal();
    }).catch(err => { msg.textContent = err.message; msg.className = 'msg error'; });
  }

  const gameGrid = document.getElementById('gameGrid');
  const emptyState = document.getElementById('emptyState');
  function loadGames() {
    db.collection('games').orderBy('createdAt', 'desc').get().then(snapshot => {
      gameGrid.innerHTML = '';
      if (snapshot.empty) { emptyState.style.display = 'block'; return; }
      emptyState.style.display = 'none';
      snapshot.forEach(doc => {
        const g = doc.data();
        const card = document.createElement('div');
        card.className = 'game-card';
        let thumbContent = g.image ? `<div class="thumb" style="background-image: url('${escapeHtml(g.image)}');"></div>` : `<div class="thumb">🕹️</div>`;
        card.innerHTML = `${thumbContent}<div class="info"><h3>${escapeHtml(g.name)}</h3><p>Play Now</p></div>`;
        card.addEventListener('click', () => openGame(g.name, g.content));
        gameGrid.appendChild(card);
      });
    });
  }

  function openGame(name, content) {
    if (!currentUser) { alert("You must be logged in to play games!"); openAuthModal(); return; }
    document.getElementById('playTitle').textContent = name;
    document.getElementById('playFrame').srcdoc = content;
    document.getElementById('playModal').classList.add('show');
  }

  function closePlayModal() { document.getElementById('playModal').classList.remove('show'); document.getElementById('playFrame').removeAttribute('srcdoc'); }

  // --- ADMIN PANEL (Manage Games + View Users only) ---
  const adminModal = document.getElementById('adminModal');
  const adminBoxContent = document.getElementById('adminBoxContent');
  let secretTapCount = 0, secretTapTimer = null;

  document.getElementById('secretSpot').addEventListener('click', () => {
    secretTapCount++;
    if (secretTapTimer) clearTimeout(secretTapTimer);
    secretTapTimer = setTimeout(() => { secretTapCount = 0; }, 2000);
    if (secretTapCount >= 3) { secretTapCount = 0; adminModal.classList.add('show'); renderAdminModal(); }
  });
  adminModal.addEventListener('click', (e) => { if (e.target === adminModal) adminModal.classList.remove('show'); });

  function renderAdminModal() { const user = auth.currentUser; if (user) renderAdminDashboard(); else renderAdminLogin(); }

  function renderAdminLogin() {
    adminBoxContent.innerHTML = `
      <h2>Admin Login</h2>
      <div class="field"><label>Admin Email</label><input type="email" id="admEmail" placeholder="admin@email.com"></div>
      <div class="field"><label>Password</label><input type="password" id="admPass" placeholder="••••••••"></div>
      <button class="btn-primary" onclick="loginAdmin()">Log In</button>
      <button class="btn-secondary" onclick="adminModal.classList.remove('show')">Cancel</button>
      <div class="msg" id="admMsg"></div>
    `;
  }

  function loginAdmin() {
    const email = document.getElementById('admEmail').value.trim();
    const pass = document.getElementById('admPass').value;
    const msg = document.getElementById('admMsg');
    msg.textContent = 'Logging in...'; msg.className = 'msg';

    auth.signInWithEmailAndPassword(email, pass)
      .then(() => renderAdminDashboard())
      .catch(err => { msg.textContent = err.message; msg.className = 'msg error'; });
  }

  function renderAdminDashboard() {
    adminBoxContent.innerHTML = `
      <h2>Admin Dashboard</h2>
      <button class="btn-primary" onclick="renderUploadSection()" style="margin-bottom:8px;">Upload Game</button>
      <button class="btn-primary" onclick="renderManageGamesSection()" style="margin-bottom:8px; background:linear-gradient(90deg, #ff9f0a, #ffb703);">Manage / Delete Games</button>
      <button class="btn-primary" onclick="renderAllUsersSection()" style="margin-bottom:8px; background:linear-gradient(90deg, #60efff, #00ff87); color:#000;">View Registered Users</button>
      <button class="btn-secondary" onclick="auth.signOut(); adminModal.classList.remove('show');">Log Out</button>
      <button class="btn-secondary" onclick="adminModal.classList.remove('show')">Close</button>
    `;
  }

  function renderUploadSection() {
    adminBoxContent.innerHTML = `
      <h2>Upload Game</h2>
      <div class="field"><label>Game Name</label><input type="text" id="gameName"></div>
      <div class="field"><label>Game Photo (Thumbnail)</label><input type="file" id="gameImage" accept="image/*"></div>
      <div class="field"><label>HTML File (.html)</label><input type="file" id="gameFile" accept=".html"></div>
      <button class="btn-primary" onclick="uploadGame()">Publish</button>
      <button class="btn-secondary" onclick="renderAdminDashboard()">Back</button>
      <div class="msg" id="admMsg"></div>
    `;
  }

  function uploadGame() {
    const file = document.getElementById('gameFile').files[0];
    const imageFile = document.getElementById('gameImage').files[0];
    const gameName = document.getElementById('gameName').value;
    const msg = document.getElementById('admMsg');
    if (!file || !gameName) { msg.textContent = "Name and HTML file required."; msg.className = 'msg error'; return; }

    msg.textContent = 'Uploading...';
    const saveToDB = (htmlContent, imageBase64) => {
      db.collection('games').add({ name: gameName, content: htmlContent, image: imageBase64, createdAt: firebase.firestore.FieldValue.serverTimestamp() })
      .then(() => { loadGames(); renderAdminDashboard(); }).catch(err => { msg.textContent = err.message; msg.className = 'msg error'; });
    };

    const htmlReader = new FileReader();
    htmlReader.onload = function(eHtml) {
      if (imageFile) {
        const imgReader = new FileReader();
        imgReader.onload = function(eImg) { saveToDB(eHtml.target.result, eImg.target.result); };
        imgReader.readAsDataURL(imageFile);
      } else { saveToDB(eHtml.target.result, null); }
    };
    htmlReader.readAsText(file);
  }

  function renderManageGamesSection() {
    adminBoxContent.innerHTML = `
      <h2>Manage Games</h2>
      <div id="gamesListAdmin" style="max-height: 220px; overflow-y: auto; margin-bottom: 12px; font-size:0.75rem;">Loading...</div>
      <button class="btn-secondary" onclick="renderAdminDashboard()">Back</button>
    `;
    db.collection('games').orderBy('createdAt', 'desc').get().then(snapshot => {
      const list = document.getElementById('gamesListAdmin');
      if (snapshot.empty) { list.innerHTML = '<p style="color:var(--muted);">No games found.</p>'; return; }
      list.innerHTML = '';
      snapshot.forEach(doc => {
        const g = doc.data();
        const div = document.createElement('div');
        div.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:var(--bg2); padding:8px 10px; border-radius:6px; margin-bottom:6px;";
        div.innerHTML = `<span>${escapeHtml(g.name)}</span><button style="background:#ff6b6b; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Delete</button>`;
        div.querySelector('button').addEventListener('click', () => deleteGame(doc.id));
        list.appendChild(div);
      });
    });
  }

  function deleteGame(id) {
    if (confirm("Are you sure you want to delete this game?")) {
      db.collection('games').doc(id).delete().then(() => {
        alert("Game deleted successfully!");
        loadGames();
        renderManageGamesSection();
      }).catch(err => alert("Error: " + err.message));
    }
  }

  function renderAllUsersSection() {
    adminBoxContent.innerHTML = `
      <h2>Registered Users</h2>
      <div id="usersListAdmin" style="max-height: 220px; overflow-y: auto; margin-bottom: 12px; font-size:0.75rem;">Loading...</div>
      <button class="btn-secondary" onclick="renderAdminDashboard()">Back</button>
    `;
    db.collection('users').get().then(snapshot => {
      const list = document.getElementById('usersListAdmin');
      if (snapshot.empty) { list.innerHTML = '<p style="color:var(--muted);">No users registered yet.</p>'; return; }
      list.innerHTML = '';
      snapshot.forEach(doc => {
        const u = doc.data();
        const div = document.createElement('div');
        div.style.cssText = "background:var(--bg2); padding:8px 10px; border-radius:6px; margin-bottom:6px;";
        div.innerHTML = `<b>Email:</b> ${escapeHtml(u.email || 'N/A')}`;
        list.appendChild(div);
      });
    });
  }

  loadGames();
</script>
</body>
</html>
