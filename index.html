<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    overflow-x: hidden;
    font-family: 'Inter', sans-serif;
    background: #14101f;
    color: #f2eefb;
    min-height: 100vh;
    scroll-behavior: smooth;
  }
  :root {
    --bg: #14101f;
    --bg2: #1c1730;
    --card: #211b38;
    --card-border: #332a54;
    --amber: #ffb703;
    --magenta: #ff3d81;
    --text: #f2eefb;
    --muted: #9088ad;
  }
  .pixel { font-family: 'Press Start 2P', monospace; }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--card-border);
    position: sticky;
    top: 0;
    background: rgba(20,16,31,0.98);
    backdrop-filter: blur(10px);
    z-index: 50;
    width: 100%;
  }
  .logo {
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .logo .cart {
    width: 22px; height: 22px;
    background: linear-gradient(135deg, var(--amber), var(--magenta));
    border-radius: 4px;
    position: relative;
  }
  .logo .cart::after {
    content: '';
    position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 6px;
    background: var(--bg);
    border-radius: 2px;
  }
  .logo span { color: var(--amber); }
  .nav-right { display: flex; gap: 8px; align-items: center; }

  .auth-btn {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.7rem;
    cursor: pointer;
  }

  .hero {
    text-align: center;
    padding: 40px 16px 30px;
    background: radial-gradient(ellipse 500px 250px at 50% 0%, rgba(255,61,129,0.15), transparent);
  }
  .hero .eyebrow { font-size: 0.55rem; color: var(--amber); letter-spacing: 2px; margin-bottom: 10px; }
  .hero h1 { font-size: 1.5rem; font-weight: 800; line-height: 1.3; max-width: 500px; margin: 0 auto; }
  .hero h1 .hl { color: var(--magenta); }
  .hero p.sub { color: var(--muted); margin-top: 12px; font-size: 0.82rem; max-width: 400px; margin-left: auto; margin-right: auto; }

  .section-label {
    max-width: 1000px;
    margin: 30px auto 12px;
    padding: 0 16px;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .grid {
    max-width: 1000px;
    margin: 0 auto 90px; /* extra bottom space so bottom nav doesn't cover last row */
    padding: 0 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  .game-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }
  .game-card:hover { border-color: var(--amber); }
  .game-card .thumb {
    width: 100%;
    aspect-ratio: 4/3;
    background: linear-gradient(135deg, #2a2350, #1c1730);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    background-size: cover;
    background-position: center;
  }
  .game-card .info { padding: 10px; }
  .game-card h3 { font-size: 0.75rem; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .game-card p { font-size: 0.6rem; color: var(--muted); }

  .empty-state { text-align: center; color: var(--muted); padding: 30px; font-size: 0.8rem; }

  /* MODALS */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(10,8,16,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 360px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-box h2 { font-size: 0.9rem; margin-bottom: 14px; }
  .field { margin-bottom: 10px; }
  .field label { font-size: 0.7rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .field input {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 9px;
    border-radius: 8px;
    font-size: 0.8rem;
  }
  .btn-primary {
    width: 100%;
    padding: 11px;
    background: linear-gradient(90deg, var(--magenta), var(--amber));
    color: #14101f;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    margin-top: 6px;
  }
  .btn-google {
    width: 100%;
    padding: 10px;
    background: #fff;
    color: #333;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.8rem;
    cursor: pointer;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-secondary {
    width: 100%;
    padding: 9px;
    background: none;
    border: 1px solid var(--card-border);
    color: var(--muted);
    border-radius: 8px;
    font-size: 0.75rem;
    cursor: pointer;
    margin-top: 6px;
  }
  .divider { text-align: center; color: var(--muted); font-size: 0.65rem; margin: 10px 0; position: relative; }
  .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 38%; height: 1px; background: var(--card-border); }
  .divider::before { left: 0; } .divider::after { right: 0; }

  .msg { font-size: 0.7rem; margin-top: 8px; text-align: center; }
  .msg.error { color: #ff6b6b; }
  .msg.success { color: #6cff9c; }

  #playModal iframe { width: 100%; flex: 1; border: none; background: #000; }
  #playModal { flex-direction: column; padding: 0; background: #000; }
  #playModal.show { z-index: 200; } /* above bottom nav too */
  .play-header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #14101f; }
  .close-btn { background: var(--card); border: 1px solid var(--card-border); color: var(--text); width: 34px; height: 34px; border-radius: 6px; cursor: pointer; font-size: 1rem; }

  footer { text-align: center; color: #4a4266; font-size: 0.65rem; padding: 20px; padding-bottom: 90px; border-top: 1px solid var(--card-border); margin-top: 30px; }

  /* ===== BOTTOM NAVIGATION BAR (separate, mobile-app style) ===== */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(20,16,31,0.98);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--card-border);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index: 60;
  }
  .bottom-nav button {
    background: none;
    border: none;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 0.6rem;
    cursor: pointer;
    padding: 4px 10px;
  }
  .bottom-nav button .icon { font-size: 1.1rem; }
  .bottom-nav button.active { color: var(--amber); }

  /* ===== LOADING OVERLAY (shown during Google redirect sign-in) ===== */
  .loading-overlay {
    position: fixed; inset: 0;
    background: var(--bg);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 300;
  }
  .loading-overlay.show { display: flex; }
  .loading-overlay p { font-size: 0.8rem; color: var(--muted); }
  .spinner {
    width: 38px; height: 38px;
    border: 3px solid var(--card-border);
    border-top-color: var(--amber);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<nav>
  <div class="logo pixel"><div class="cart"></div>Pixel<span>Forge</span></div>
  <div class="nav-right">
    <button class="auth-btn pixel" id="installNavBtn" onclick="triggerInstallPrompt()" style="display:none;">Install</button>
  </div>
</nav>

<section class="hero">
  <div class="eyebrow pixel">PRESS START</div>
  <h1>Free browser games. <span class="hl">No installs.</span></h1>
  <p class="sub">Instant-play browser games. Just tap and play.</p>
</section>

<div class="section-label pixel" id="gameGridContainer">// GAME LIBRARY</div>
<div class="grid" id="gameGrid"></div>
<div class="empty-state" id="emptyState" style="display:none;">No games uploaded yet — check back soon.</div>

<div class="modal-overlay" id="playModal">
  <div class="play-header">
    <h3 id="playTitle" style="font-size:0.8rem;"></h3>
    <button class="close-btn" onclick="closePlayModal()">✕</button>
  </div>
  <!-- sandbox: uploaded game HTML cannot read parent page/cookies/storage -->
  <iframe id="playFrame" sandbox="allow-scripts allow-same-origin"></iframe>
</div>

<div class="modal-overlay" id="adminModal">
  <div class="modal-box" id="adminBoxContent"></div>
</div>

<footer>PixelForge — games run entirely in your browser.
  <span id="secretSpot" style="display:inline-block; width:40px; height:40px; vertical-align:middle;"></span>
</footer>

<!-- ===== SEPARATE BOTTOM NAV BAR (games ke liye) ===== -->
<div class="bottom-nav">
  <button class="active" onclick="window.scrollTo({top:0, behavior:'smooth'})">
    <span class="icon">🏠</span>Home
  </button>
  <button onclick="document.getElementById('gameGridContainer').scrollIntoView({behavior:'smooth'})">
    <span class="icon">🕹️</span>Games
  </button>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- JSZip: lets the admin upload a .zip game (HTML+CSS+JS+images bundled together) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDXHnyAUPOYd45RCYjienLhbFviUCe5JS4",
    authDomain: "game-2e42e.firebaseapp.com",
    projectId: "game-2e42e",
    storageBucket: "game-2e42e.firebasestorage.app",
    messagingSenderId: "323139672747",
    appId: "1:323139672747:web:205c4b9fcd214791dfb5ee",
    measurementId: "G-YW325R7TT7"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth(); // still used for admin login only
  const db = firebase.firestore();

  function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str == null ? '' : String(str); return d.innerHTML; }

  const gameGrid = document.getElementById('gameGrid');
  const emptyState = document.getElementById('emptyState');
  function loadGames() {
    db.collection('games').orderBy('createdAt', 'desc').get().then(snapshot => {
      gameGrid.innerHTML = '';
      if (snapshot.empty) { emptyState.style.display = 'block'; return; }
      emptyState.style.display = 'none';
      snapshot.forEach(doc => {
        const g = doc.data();
        const card = document.createElement('div');
        card.className = 'game-card';
        let thumbContent = g.image ? `<div class="thumb" style="background-image: url('${g.image}');"></div>` : `<div class="thumb">🕹️</div>`;
        card.innerHTML = `${thumbContent}<div class="info"><h3>${escapeHtml(g.name)}</h3><p>Play Now</p></div>`;
        card.addEventListener('click', () => openGame(g.name, g.content));
        gameGrid.appendChild(card);
      });
    });
  }

  function openGame(name, content) {
    document.getElementById('playTitle').textContent = name;
    document.getElementById('playFrame').srcdoc = content;
    document.getElementById('playModal').classList.add('show');
    document.querySelector('.bottom-nav').style.display = 'none'; // fully hide site nav while playing
    document.body.style.overflow = 'hidden';
  }

  function closePlayModal() {
    document.getElementById('playModal').classList.remove('show');
    document.getElementById('playFrame').removeAttribute('srcdoc');
    document.querySelector('.bottom-nav').style.display = '';
    document.body.style.overflow = '';
  }

  // --- ADMIN PANEL (Manage Games + View Users only) ---
  const adminModal = document.getElementById('adminModal');
  const adminBoxContent = document.getElementById('adminBoxContent');
  let secretTapCount = 0, secretTapTimer = null;

  document.getElementById('secretSpot').addEventListener('click', () => {
    secretTapCount++;
    if (secretTapTimer) clearTimeout(secretTapTimer);
    secretTapTimer = setTimeout(() => { secretTapCount = 0; }, 2000);
    if (secretTapCount >= 3) { secretTapCount = 0; adminModal.classList.add('show'); renderAdminModal(); }
  });
  adminModal.addEventListener('click', (e) => { if (e.target === adminModal) adminModal.classList.remove('show'); });

  function renderAdminModal() { const user = auth.currentUser; if (user) renderAdminDashboard(); else renderAdminLogin(); }

  function renderAdminLogin() {
    adminBoxContent.innerHTML = `
      <h2>Admin Login</h2>
      <div class="field"><label>Admin Email</label><input type="email" id="admEmail" placeholder="admin@email.com"></div>
      <div class="field"><label>Password</label><input type="password" id="admPass" placeholder="••••••••"></div>
      <button class="btn-primary" onclick="loginAdmin()">Log In</button>
      <button class="btn-secondary" onclick="adminModal.classList.remove('show')">Cancel</button>
      <div class="msg" id="admMsg"></div>
    `;
  }

  function loginAdmin() {
    const email = document.getElementById('admEmail').value.trim();
    const pass = document.getElementById('admPass').value;
    const msg = document.getElementById('admMsg');
    msg.textContent = 'Logging in...'; msg.className = 'msg';

    auth.signInWithEmailAndPassword(email, pass)
      .then(() => renderAdminDashboard())
      .catch(err => { msg.textContent = err.message; msg.className = 'msg error'; });
  }

  function renderAdminDashboard() {
    adminBoxContent.innerHTML = `
      <h2>Admin Dashboard</h2>
      <button class="btn-primary" onclick="renderUploadSection()" style="margin-bottom:8px;">Upload Game</button>
      <button class="btn-primary" onclick="renderManageGamesSection()" style="margin-bottom:8px; background:linear-gradient(90deg, #ff9f0a, #ffb703);">Manage / Delete Games</button>
      <button class="btn-secondary" onclick="auth.signOut(); adminModal.classList.remove('show');">Log Out</button>
      <button class="btn-secondary" onclick="adminModal.classList.remove('show')">Close</button>
    `;
  }

  function renderUploadSection() {
    adminBoxContent.innerHTML = `
      <h2>Upload Game</h2>
      <div class="field"><label>Game Name</label><input type="text" id="gameName"></div>
      <div class="field"><label>Game Photo (Thumbnail)</label><input type="file" id="gameImage" accept="image/*"></div>
      <div class="field"><label>Game File (.html or .zip)</label><input type="file" id="gameFile" accept=".html,.zip"></div>
      <p style="font-size:0.65rem; color:var(--muted); margin-bottom:8px;">ZIP mein ek index.html hona chahiye jismein CSS/JS/images relative paths (jaise src="game.js") se link ho. Total size ~900KB se kam rakho.</p>
      <button class="btn-primary" onclick="uploadGame()">Publish</button>
      <button class="btn-secondary" onclick="renderAdminDashboard()">Back</button>
      <div class="msg" id="admMsg"></div>
    `;
  }

  // Resolves a relative path like "img/x.png" against the folder of the current file inside the zip.
  function resolveZipPath(baseDir, relPath) {
    if (/^([a-z]+:)?\/\//i.test(relPath) || relPath.startsWith('data:')) return null; // external/absolute — leave alone
    const combined = (baseDir + relPath).replace(/^\.\//, '');
    const parts = combined.split('/');
    const stack = [];
    for (const p of parts) {
      if (p === '..') stack.pop();
      else if (p !== '.' && p !== '') stack.push(p);
    }
    return stack.join('/');
  }

  function guessMime(path) {
    const ext = path.split('.').pop().toLowerCase();
    const map = {
      png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', svg: 'image/svg+xml', webp: 'image/webp',
      mp3: 'audio/mpeg', wav: 'audio/wav', ogg: 'audio/ogg', mp4: 'video/mp4',
      json: 'application/json', css: 'text/css', js: 'application/javascript', woff: 'font/woff', woff2: 'font/woff2'
    };
    return map[ext] || 'application/octet-stream';
  }

  // Turns a multi-file ZIP game into one self-contained HTML string (images/audio/css/js inlined),
  // so it can still be played the same way as before — inside an iframe's srcdoc.
  async function zipToSelfContainedHtml(zipFile) {
    const zip = await JSZip.loadAsync(zipFile);
    let htmlPath = null;
    zip.forEach((relPath, entry) => {
      if (!entry.dir && relPath.toLowerCase().endsWith('.html')) {
        if (!htmlPath || relPath.toLowerCase() === 'index.html' || relPath.toLowerCase().endsWith('/index.html')) htmlPath = relPath;
      }
    });
    if (!htmlPath) throw new Error('ZIP mein koi .html file nahi mili — ek index.html zaroor honi chahiye.');

    const baseDir = htmlPath.includes('/') ? htmlPath.substring(0, htmlPath.lastIndexOf('/') + 1) : '';
    let htmlText = await zip.file(htmlPath).async('string');

    async function fileToDataUri(path) {
      const f = zip.file(path);
      if (!f) return null;
      const base64 = await f.async('base64');
      return `data:${guessMime(path)};base64,${base64}`;
    }

    async function inlineCssUrls(cssText, cssDir) {
      const urlRegex = /url\(\s*['"]?([^'")]+)['"]?\s*\)/g;
      const matches = [...cssText.matchAll(urlRegex)];
      for (const m of matches) {
        const resolved = resolveZipPath(cssDir, m[1]);
        if (resolved) {
          const uri = await fileToDataUri(resolved);
          if (uri) cssText = cssText.split(m[0]).join(`url("${uri}")`);
        }
      }
      return cssText;
    }

    const doc = new DOMParser().parseFromString(htmlText, 'text/html');

    for (const el of doc.querySelectorAll('img[src], audio[src], video[src], source[src]')) {
      const resolved = resolveZipPath(baseDir, el.getAttribute('src'));
      if (resolved) { const uri = await fileToDataUri(resolved); if (uri) el.setAttribute('src', uri); }
    }

    for (const link of Array.from(doc.querySelectorAll('link[rel="stylesheet"][href]'))) {
      const resolved = resolveZipPath(baseDir, link.getAttribute('href'));
      const cssFile = resolved ? zip.file(resolved) : null;
      if (cssFile) {
        let cssText = await cssFile.async('string');
        const cssDir = resolved.includes('/') ? resolved.substring(0, resolved.lastIndexOf('/') + 1) : '';
        cssText = await inlineCssUrls(cssText, cssDir);
        const styleTag = doc.createElement('style');
        styleTag.textContent = cssText;
        link.replaceWith(styleTag);
      }
    }

    for (const script of Array.from(doc.querySelectorAll('script[src]'))) {
      const resolved = resolveZipPath(baseDir, script.getAttribute('src'));
      const jsFile = resolved ? zip.file(resolved) : null;
      if (jsFile) {
        let jsText = await jsFile.async('string');
        jsText = jsText.replace(/<\/script>/gi, '<\\/script>'); // avoid breaking out of the inline script tag
        const inlineScript = doc.createElement('script');
        inlineScript.textContent = jsText;
        script.replaceWith(inlineScript);
      }
    }

    for (const styleEl of doc.querySelectorAll('style')) {
      styleEl.textContent = await inlineCssUrls(styleEl.textContent, baseDir);
    }

    // FIX: some games load assets (sounds/images) from inside JavaScript code —
    // e.g. fetch('jump.mp3') or new Audio('jump.mp3') — instead of an HTML tag.
    // Those relative paths can't resolve inside a srcdoc iframe (no real base URL),
    // so we scan every non-HTML file in the ZIP and, if its filename appears as a
    // quoted string literal inside any <script> block, swap it for an embedded data URI.
    const assetPaths = [];
    zip.forEach((relPath, entry) => {
      if (!entry.dir && relPath !== htmlPath && !relPath.toLowerCase().endsWith('.js') && !relPath.toLowerCase().endsWith('.css')) {
        assetPaths.push(relPath);
      }
    });
    for (const assetPath of assetPaths) {
      const relKey = assetPath.startsWith(baseDir) ? assetPath.slice(baseDir.length) : assetPath;
      const uri = await fileToDataUri(assetPath);
      if (!uri) continue;
      for (const scriptEl of doc.querySelectorAll('script:not([src])')) {
        if (scriptEl.textContent.includes(`'${relKey}'`)) {
          scriptEl.textContent = scriptEl.textContent.split(`'${relKey}'`).join(`'${uri}'`);
        }
        if (scriptEl.textContent.includes(`"${relKey}"`)) {
          scriptEl.textContent = scriptEl.textContent.split(`"${relKey}"`).join(`"${uri}"`);
        }
      }
    }

    return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
  }

  function uploadGame() {
    const file = document.getElementById('gameFile').files[0];
    const imageFile = document.getElementById('gameImage').files[0];
    const gameName = document.getElementById('gameName').value;
    const msg = document.getElementById('admMsg');
    if (!file || !gameName) { msg.textContent = "Name and game file required."; msg.className = 'msg error'; return; }

    msg.textContent = 'Uploading...';
    const saveToDB = (htmlContent, imageBase64) => {
      const approxSizeKB = Math.round(new Blob([htmlContent]).size / 1024);
      if (approxSizeKB > 900) {
        msg.textContent = `Game too big (${approxSizeKB}KB) — Firestore limit ~1MB. Use smaller images/audio.`;
        msg.className = 'msg error';
        return;
      }
      db.collection('games').add({ name: gameName, content: htmlContent, image: imageBase64, createdAt: firebase.firestore.FieldValue.serverTimestamp() })
      .then(() => { loadGames(); renderAdminDashboard(); }).catch(err => { msg.textContent = err.message; msg.className = 'msg error'; });
    };

    const finishWithHtml = (htmlContent) => {
      if (imageFile) {
        const imgReader = new FileReader();
        imgReader.onload = (eImg) => saveToDB(htmlContent, eImg.target.result);
        imgReader.readAsDataURL(imageFile);
      } else { saveToDB(htmlContent, null); }
    };

    const lowerName = file.name.toLowerCase();
    if (lowerName.endsWith('.zip')) {
      zipToSelfContainedHtml(file).then(finishWithHtml).catch(err => { msg.textContent = err.message; msg.className = 'msg error'; });
    } else {
      const htmlReader = new FileReader();
      htmlReader.onload = (eHtml) => finishWithHtml(eHtml.target.result);
      htmlReader.readAsText(file);
    }
  }

  function renderManageGamesSection() {
    adminBoxContent.innerHTML = `
      <h2>Manage Games</h2>
      <div id="gamesListAdmin" style="max-height: 220px; overflow-y: auto; margin-bottom: 12px; font-size:0.75rem;">Loading...</div>
      <button class="btn-secondary" onclick="renderAdminDashboard()">Back</button>
    `;
    db.collection('games').orderBy('createdAt', 'desc').get().then(snapshot => {
      const list = document.getElementById('gamesListAdmin');
      if (snapshot.empty) { list.innerHTML = '<p style="color:var(--muted);">No games found.</p>'; return; }
      list.innerHTML = '';
      snapshot.forEach(doc => {
        const g = doc.data();
        const div = document.createElement('div');
        div.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:var(--bg2); padding:8px 10px; border-radius:6px; margin-bottom:6px;";
        div.innerHTML = `<span>${escapeHtml(g.name)}</span><button style="background:#ff6b6b; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Delete</button>`;
        div.querySelector('button').addEventListener('click', () => deleteGame(doc.id));
        list.appendChild(div);
      });
    });
  }

  function deleteGame(id) {
    if (confirm("Are you sure you want to delete this game?")) {
      db.collection('games').doc(id).delete().then(() => {
        alert("Game deleted successfully!");
        loadGames();
        renderManageGamesSection();
      }).catch(err => alert("Error: " + err.message));
    }
  }

  loadGames();

  // ===== CUSTOM "ADD TO HOME SCREEN" LOGIC =====
  // A minimal service worker (registered from an in-memory blob, no separate file needed)
  // helps Chrome recognize the site as installable.
  if ('serviceWorker' in navigator) {
    const swCode = "self.addEventListener('fetch', function(e) {});";
    const swBlob = new Blob([swCode], { type: 'text/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.error('SW register failed', err));
  }

  let deferredInstallPrompt = null;

  function isAlreadyInstalled() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }

  // Chrome fires this when the site is installable. We capture it and show our own
  // small "Install" button next to LOGIN instead of Chrome's own banner.
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    if (!isAlreadyInstalled()) {
      document.getElementById('installNavBtn').style.display = 'inline-block';
    }
  });

  function triggerInstallPrompt() {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(() => {
      deferredInstallPrompt = null;
      document.getElementById('installNavBtn').style.display = 'none';
    });
  }
</script>
</body>
